server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA catch-all
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Transparent proxy to MOXELA backend — avoids browser CORS entirely.
    # All requests to /api/ are forwarded to the backend configured via
    # MOXELA_BACKEND_URL env var (default: http://stark.oslo.nevion.com).
    location /api/ {
        proxy_pass         ${MOXELA_BACKEND_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $proxy_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;

        # Inject CORS headers so browser is satisfied
        add_header 'Access-Control-Allow-Origin'  '*'                                           always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PATCH, PUT, DELETE, OPTIONS'      always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization'                 always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
